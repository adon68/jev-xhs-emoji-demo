<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>写想法</title>
<style>
:root{--pink:#ff7088;--ink:#222;--muted:#a8abb3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(165deg,#dff7ee 0%,#f3faf6 28%,#f6f6f5 70%,#efefef 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink)}
.phone{max-width:430px;min-height:100dvh;margin:0 auto;padding:0 16px 28px}
.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.xbtn{width:40px;height:40px;border:0;background:transparent;font-size:28px;line-height:1;color:#222;cursor:pointer}
.next{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:650;cursor:pointer}
.keybox{margin:8px 0 12px;padding:12px;border-radius:14px;background:#fff;border:1px solid #ffd5dc;font-size:12px;color:#8a5a63}
.keybox.hidden{display:none!important}
.keyrow{display:flex;gap:8px;margin-top:8px}
.keyrow input{flex:1;min-width:0;border:1px solid #e5e7eb;border-radius:10px;padding:9px 10px;font-size:14px}
.keyrow button{border:0;border-radius:10px;background:var(--pink);color:#fff;padding:8px 12px;font-weight:650;cursor:pointer}
.card{background:#fff;border-radius:28px;min-height:min(58dvh,520px);padding:28px 26px 52px;box-shadow:0 14px 34px rgba(90,110,100,.08);display:flex;flex-direction:column;position:relative;overflow:hidden}
.quote{color:#ececed;font-family:Georgia,"Songti SC",serif;font-size:72px;font-weight:700;line-height:.75;height:54px;user-select:none}
.title{margin:4px 0 10px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.editor-wrap{position:relative;flex:1;min-height:160px}
#editor{min-height:160px;outline:none;font-size:20px;line-height:1.7;white-space:pre-wrap;word-break:break-word;caret-color:var(--pink);color:#303138;position:relative}
#editor.is-empty:before{content:attr(data-placeholder);color:#b7bac2;pointer-events:none;position:absolute;left:0;top:0;right:0;white-space:pre-wrap}
.pink-caret{position:absolute;left:0;top:5px;width:2px;height:28px;background:var(--pink);border-radius:1px;pointer-events:none;display:none}
.pink-caret.show{display:block}
.xhs-sticker-sprite{display:inline-block;height:1.15em;width:1.15em;vertical-align:-0.2em;margin:0 0.05em;background-image:url(/sprites/sheet.png);background-repeat:no-repeat;background-size:calc(var(--sheet-w) * 1.15em / var(--cell)) calc(var(--sheet-h) * 1.15em / var(--cell));user-select:none;pointer-events:none}
.xhs-sticker{height:1.15em;width:1.15em;object-fit:contain;vertical-align:-0.2em;margin:0 0.05em;user-select:none;-webkit-user-drag:none;display:inline-block}
.pending-marker{display:inline-block;width:0;height:0;overflow:hidden}
.status{position:absolute;left:22px;right:22px;bottom:14px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#c5c8ce;flex:0 0 auto}
.dot.ok{background:#3ecf8e}.dot.busy{background:#ff8da0;animation:blink 1s infinite}.dot.warn{background:#f0b429}
@keyframes blink{50%{opacity:.35}}
#latency{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.long{margin-top:18px;width:100%;border:0;background:#fff;border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 28px rgba(90,110,100,.07);text-align:left;cursor:pointer}
.long-ico{width:48px;height:48px;border-radius:12px;background:#f3f4f5;display:grid;place-items:center;font-size:24px}
.long-title{font-size:18px;font-weight:760}.long-sub{font-size:13px;color:var(--muted);margin-top:3px}
.chev{margin-left:auto;color:#c8cad0;font-size:28px;font-weight:300}
details.debug{margin-top:14px;color:#9aa0a8;font-size:12px}
details.debug summary{cursor:pointer;text-align:center;list-style:none}
#history{margin-top:8px;max-height:180px;overflow:auto}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.item.hit{outline:1px solid #ffd0d8}
.meta{display:flex;align-items:center;gap:6px}
.hist-sticker{height:1.15em;width:1.15em;object-fit:contain;vertical-align:-0.2em}
.pct{color:var(--pink);font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="nav">
    <button class="xbtn" id="clearBtn" type="button" aria-label="关闭">×</button>
    <button class="next" id="nextBtn" type="button">下一步</button>
  </div>
  <div class="keybox" id="keybox">
    <div>TypeSafe API Key 只保存在本机</div>
    <div class="keyrow">
      <input id="apiKey" type="password" placeholder="粘贴 API Key" autocomplete="off" />
      <button id="saveKey" type="button">保存</button>
    </div>
  </div>
  <section class="card">
    <div class="quote">“</div>
    <h1 class="title">写想法</h1>
    <div class="editor-wrap">
      <span class="pink-caret" id="fakeCaret"></span>
      <div id="editor" class="is-empty" contenteditable="true" spellcheck="false" data-placeholder="说点什么或提个问题..."></div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">等待输入…</span>
      <span id="latency"></span>
    </div>
  </section>
  <button class="long" id="longBtn" type="button">
    <span class="long-ico">📝</span>
    <span><div class="long-title">写长文</div><div class="long-sub">支持万字，全屏阅读体验</div></span>
    <span class="chev">›</span>
  </button>
  <details class="debug"><summary>判定记录</summary><div id="history"></div></details>
</div>
<script>
const DEBOUNCE_MS = 550;
const editor = document.getElementById('editor');
const statusEl = document.getElementById('status');
const latencyEl = document.getElementById('latency');
const historyEl = document.getElementById('history');
const keybox = document.getElementById('keybox');
const fakeCaret = document.getElementById('fakeCaret');
const dot = document.getElementById('dot');

let stickers = {};
let timer = null;
let flashTimer = null;
let seq = 0;
let composing = false;
let history = [];

const choiceToSticker = {
  '🥺':'可怜','🥹':'哭惹','😆':'大笑','🤣':'笑哭了','🤭':'捂嘴笑','😳':'害羞','😱':'惊恐','🫠':'尬住',
  '🥲':'笑哭','😭':'泪崩','😤':'生气','🙄':'斜眼','😴':'睡觉','🥱':'叹气','🤯':'石化','😎':'得意',
  '🥰':'超喜欢','😍':'心心眼','😘':'飞吻','💋':'亲一个','🫶':'赞','💕':'超喜欢','💗':'心心眼',
  '💖':'超喜欢','💘':'心心眼','❤️‍🔥':'超喜欢','✨':'哇','🌟':'棒','💫':'哇','🎀':'萌萌哒','💅':'得意',
  '💄':'自拍','🛍️':'买爆','📸':'自拍','📷':'自拍','🎬':'自拍','📱':'暗中观察','💬':'蹲后续','👀':'暗中观察',
  '🙋':'赞','🙌':'赞','👏':'棒','🤝':'赞','💯':'棒','🔥':'哇','🎉':'派对','🥳':'派对','💪':'棒',
  '🤑':'买爆','💸':'买爆','🧧':'黄金薯','🧋':'喝奶茶','☕':'喝奶茶','🍰':'吧唧','🍓':'吧唧','🍑':'吧唧',
  '🌶️':'吧唧','🍜':'吧唧','🍣':'吧唧','🍕':'吧唧','🥗':'吧唧','🍳':'吧唧','☀️':'微笑','☁️':'叹气',
  '❤️':'心心眼','😊':'微笑','😄':'大笑','😁':'嘻嘻','😉':'坏笑','😌':'微笑','😋':'吧唧','🤗':'超喜欢',
  '🤔':'黑薯问号','😑':'呃','😔':'失望','😢':'哭惹','😩':'完啦','😡':'生气','👍':'赞','💤':'睡觉'
};

function setStatus(text, mode) {
  statusEl.textContent = text;
  dot.className = 'dot' + (mode ? ' ' + mode : '');
}
function isEmpty() {
  return !editor.textContent.replace(/\u200b/g, '').trim() && !editor.querySelector('.xhs-sticker');
}
function syncEmptyUI() {
  const empty = isEmpty();
  editor.classList.toggle('is-empty', empty);
  fakeCaret.classList.toggle('show', empty && document.activeElement !== editor);
}
async function refreshKey() {
  try {
    const d = await fetch('/api/key-status').then(r => r.json());
    keybox.classList.toggle('hidden', !!d.configured);
    if (d.configured) setStatus('Key 已保存', 'ok');
  } catch (e) {
    setStatus('连不上本地服务', 'warn');
  }
}
document.getElementById('saveKey').onclick = async () => {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (apiKey.length < 8) return setStatus('Key 太短', 'warn');
  const r = await fetch('/api/save-key', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ apiKey })
  });
  if (r.ok) { setStatus('Key 已保存', 'ok'); refreshKey(); }
  else setStatus('Key 保存失败', 'warn');
};
async function loadStickers() {
  const [d, atlas] = await Promise.all([
    fetch('/xhs-small/map.json?v=5').then(r => r.json()),
    fetch('/sprites/atlas.json?v=5').then(r => r.json()).catch(() => null)
  ]);
  stickers = Object.fromEntries(d.items.map(x => [x.name, x]));
  window.__stickerAtlas = atlas;
  if (atlas) {
    const w = atlas.cols * (atlas.cell + atlas.pad) + atlas.pad;
    const h = atlas.rows * (atlas.cell + atlas.pad) + atlas.pad;
    document.documentElement.style.setProperty('--sheet-w', w + 'px');
    document.documentElement.style.setProperty('--sheet-h', h + 'px');
    document.documentElement.style.setProperty('--cell', String(atlas.cell || 64));
  }
}
function renderHistory() {
  historyEl.innerHTML = '';
  if (!history.length) {
    historyEl.innerHTML = '<div style="text-align:center;padding:8px">打完一句停一下，贴纸会跟在句末</div>';
    return;
  }
  for (const x of history) {
    const row = document.createElement('div');
    row.className = 'item' + (x.hit ? ' hit' : '');
    const tx = document.createElement('div');
    tx.textContent = x.text;
    const meta = document.createElement('div');
    meta.className = 'meta';
    if (x.name && stickers[x.name]) {
      const img = document.createElement('img');
      img.className = 'hist-sticker';
      img.src = stickers[x.name].src;
      img.alt = x.name;
      meta.append(img);
    }
    const p = document.createElement('span');
    p.className = 'pct';
    p.textContent = x.pending ? '…' : Math.round((x.conf || 0) * 100) + '%';
    meta.append(p);
    if (x.ms != null) {
      const m = document.createElement('span');
      m.textContent = x.ms + 'ms';
      meta.append(m);
    }
    row.append(tx, meta);
    historyEl.append(row);
  }
}
function currentBlock() {
  const s = getSelection();
  let n = s && s.anchorNode;
  if (!n || !editor.contains(n)) return null;
  if (n === editor) {
    const d = document.createElement('div');
    d.append(document.createElement('br'));
    editor.append(d);
    return d;
  }
  if (n.nodeType === 3) n = n.parentNode;
  while (n && n.parentNode !== editor) n = n.parentNode;
  return n || editor;
}
function phraseBeforeCaret() {
  const s = getSelection();
  if (!s || !s.rangeCount || !editor.contains(s.anchorNode)) return null;
  const block = currentBlock();
  if (!block) return null;
  const r = s.getRangeAt(0).cloneRange();
  r.collapse(true);
  let startNode = block, startOffset = 0;
  for (const img of block.querySelectorAll('.xhs-sticker')) {
    try {
      startNode = img.parentNode;
      startOffset = [...img.parentNode.childNodes].indexOf(img) + 1;
    } catch (e) {}
  }
  const q = document.createRange();
  try {
    q.setStart(startNode, startOffset);
    q.setEnd(r.endContainer, r.endOffset);
  } catch (e) { return null; }
  const bare = q.toString().replace(/\u00a0/g, ' ').trim();
  return { bare, range: r, block };
}
function incomplete(s) {
  if (s.length < 2) return true;
  if (/[A-Za-z']/.test(s)) return true;
  return false;
}
function putMarker(requestId, range) {
  const m = document.createElement('span');
  m.className = 'pending-marker';
  m.dataset.requestId = requestId;
  m.contentEditable = 'false';
  m.append(document.createTextNode('\u200b'));
  range.insertNode(m);
  const s = getSelection();
  const nr = document.createRange();
  nr.setStartAfter(m);
  nr.collapse(true);
  s.removeAllRanges();
  s.addRange(nr);
  return m;
}
function flash() {
  clearTimeout(flashTimer);
  editor.style.boxShadow = 'inset 0 0 0 2px #ffc1cc';
  flashTimer = setTimeout(() => { editor.style.boxShadow = ''; }, 500);
}
function insertSticker(marker, name) {
  if (!marker || !marker.isConnected || !stickers[name]) return false;
  const atlas = window.__stickerAtlas;
  const entry = atlas && atlas.items && atlas.items.find(it => it.name === name);
  let node;
  if (entry) {
    const span = document.createElement('span');
    span.className = 'xhs-sticker xhs-sticker-sprite';
    span.title = name;
    span.dataset.sticker = name;
    span.contentEditable = 'false';
    const cell = (window.__stickerAtlas && window.__stickerAtlas.cell) || 64;
    span.style.backgroundPosition = 'calc(-' + entry.x + ' * 1.15em / ' + cell + ') calc(-' + entry.y + ' * 1.15em / ' + cell + ')';
    node = span;
  } else {
    const img = document.createElement('img');
    img.className = 'xhs-sticker';
    img.src = stickers[name].src;
    img.alt = '[' + name + ']';
    img.title = name;
    img.dataset.sticker = name;
    img.contentEditable = 'false';
    img.draggable = false;
    node = img;
  }
  marker.before(node);
  marker.before(document.createTextNode(' '));
  marker.remove();
  const s = getSelection();
  if (s) {
    const r = document.createRange();
    r.setStartAfter(node.nextSibling || node);
    r.collapse(true);
    s.removeAllRanges();
    s.addRange(r);
  }
  if (typeof syncEmptyUI === 'function') syncEmptyUI();
  else if (typeof updatePlaceholderAndCaret === 'function') updatePlaceholderAndCaret();
  if (typeof flash === 'function') flash();
  return true;
}
function schedule() {
  clearTimeout(timer);
  if (composing) return;
  timer = setTimeout(runSuggest, DEBOUNCE_MS);
  setStatus('等你说完这句…');
  latencyEl.textContent = '防抖 ' + DEBOUNCE_MS + 'ms…';
}
async function runSuggest() {
  if (composing) return;
  const p = phraseBeforeCaret();
  if (!p || incomplete(p.bare)) {
    setStatus('这句还不完整，先不插');
    return;
  }
  const id = String(++seq);
  const bare = p.bare;
  const marker = putMarker(id, p.range);
  setStatus('判定这句…', 'busy');
  latencyEl.textContent = '防抖 ' + DEBOUNCE_MS + 'ms · API 请求中…';
  history.unshift({ text: bare, pending: true });
  renderHistory();
  const t0 = performance.now();
  try {
    const r = await fetch('/api/suggest-emoji', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: bare, requestId: id })
    });
    const d = await r.json();
    const clientMs = Math.round(performance.now() - t0);
    const apiMs = d.responseTime ?? clientMs;
    const total = DEBOUNCE_MS + clientMs;
    if (history[0] && history[0].pending && history[0].text === bare) history.shift();
    if (!r.ok) {
      marker.remove();
      if (r.status === 401) keybox.classList.remove('hidden');
      setStatus(d.error || '请求失败', 'warn');
      latencyEl.textContent = '失败 · ' + apiMs + 'ms';
      renderHistory();
      return;
    }
    latencyEl.textContent = '防抖 ' + DEBOUNCE_MS + 'ms · API ' + apiMs + 'ms · 合计约 ' + total + 'ms';
    if (d.accepted && d.emoji) {
      const name = stickers[d.emoji] ? d.emoji : (choiceToSticker[d.emoji] || '微笑');
      const ok = insertSticker(marker, name);
      history.unshift({ text: bare, name, conf: d.confidence || 0, ms: apiMs, hit: ok });
      setStatus('插入「' + name + '」· ' + Math.round((d.confidence || 0) * 100) + '% · ' + apiMs + 'ms', 'ok');
    } else {
      marker.remove();
      history.unshift({ text: bare, conf: d.confidence || 0, ms: apiMs, hit: false });
      setStatus('先不插：把握不够 · ' + apiMs + 'ms');
    }
    renderHistory();
  } catch (e) {
    marker.remove();
    if (history[0] && history[0].pending && history[0].text === bare) history.shift();
    renderHistory();
    setStatus('请求失败：' + e.message, 'warn');
  }
}

editor.addEventListener('compositionstart', () => {
  composing = true;
  clearTimeout(timer);
  setStatus('输入法拼写中…');
});
editor.addEventListener('compositionend', () => {
  composing = false;
  syncEmptyUI();
  schedule();
});
editor.addEventListener('input', (e) => {
  syncEmptyUI();
  if (composing) return;
  if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') {
    clearTimeout(timer);
    setStatus('已换行；上一句贴纸仍会插在上面');
    return;
  }
  schedule();
});
editor.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || composing) return;
  const s = getSelection();
  if (s && !s.isCollapsed) s.collapseToEnd();
  clearTimeout(timer);
  setStatus('换行中；上一句贴纸仍会保留');
});
editor.addEventListener('focus', syncEmptyUI);
editor.addEventListener('blur', syncEmptyUI);
editor.addEventListener('paste', (e) => {
  e.preventDefault();
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
document.getElementById('clearBtn').onclick = () => {
  editor.innerHTML = '';
  syncEmptyUI();
  setStatus('已清空');
};
document.getElementById('nextBtn').onclick = () => setStatus('Demo：下一步仅展示样式');
document.getElementById('longBtn').onclick = () => setStatus('Demo：写长文入口仅展示样式');

loadStickers().then(() => renderHistory()).catch(() => setStatus('贴纸包加载失败', 'warn'));
refreshKey();
syncEmptyUI();
</script>
</body>
</html>
